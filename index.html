<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iRamble</title><style>
:root{--ink:#203033;--paper:#f5f3ef;--sea:#dcebea;--teal:#247b77;--dark:#174d50;--line:#c1cecc;--rose:#a44336}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1020px;margin:auto;padding:25px 18px 42px}h1{margin:0;font-family:Georgia,serif;font-size:clamp(2.4rem,7vw,4.4rem);color:var(--dark)}.sub{margin:.35rem 0 22px;color:#566568}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.room{border:0;background:none;padding:0;cursor:pointer;text-align:center;color:inherit}.room svg{display:block;width:100%;max-width:245px;margin:auto;filter:drop-shadow(0 7px 8px rgba(25,50,48,.08))}.room:focus-visible{outline:3px solid #6da6a1;outline-offset:5px;border-radius:50%}.help{text-align:center;color:#596968;margin:22px 0 0}.screen{max-width:720px;margin:auto}.back{border:0;background:none;padding:0;color:#376c68;font:inherit;font-weight:750;cursor:pointer}.card{margin-top:16px;padding:clamp(21px,5vw,38px);border:1px solid #d8dfdc;border-radius:24px;background:#fffdf9;box-shadow:0 12px 35px rgba(25,50,48,.08)}.pill{display:inline-block;border-radius:30px;background:var(--sea);padding:5px 10px;font-size:.82rem;font-weight:800;color:#245a58}.card h2{font-family:Georgia,serif;font-size:clamp(2rem,6vw,3.4rem);margin:14px 0 5px}.card p{color:#546262;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:24px 0}.stat{padding:15px;border-radius:15px;background:#f0f5f4}.stat strong{display:block;font-size:1.35rem}.actions{display:flex;flex-wrap:wrap;gap:10px}.action{border:0;border-radius:11px;padding:11px 14px;background:var(--dark);color:#fff;font:inherit;font-weight:750;cursor:pointer}.action.light{background:#e3ecea;color:var(--ink)}.queue{margin-top:22px;padding:15px;border-radius:15px;background:#f7f5f0}.queue h3{margin:0 0 8px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:16px;background:rgba(20,35,35,.48)}.modal.open{display:grid}.dialog{width:min(460px,100%);padding:24px;border-radius:20px;background:#fffdf9;box-shadow:0 18px 45px rgba(0,0,0,.2)}.dialog h2{margin:0 0 16px;font-family:Georgia,serif}.dialog label{display:block;margin:13px 0 5px;font-weight:700}.dialog input{width:100%;padding:11px;border:1px solid #bdcbc8;border-radius:9px;font:inherit}.dialog .actions{margin-top:20px}@media(max-width:620px){main{padding:20px 12px}.rooms{grid-template-columns:repeat(2,1fr);gap:12px}.row{grid-template-columns:1fr}}
</style></head><body><main><section id="home"><h1>iRamble</h1><p class="sub">Choose an open slice to reserve a seat. Click the center of an active circle to enter its room.</p><div class="rooms" id="rooms"></div><p class="help">Public conversations · 1 host + 11 listener seats · rooms start even when not full</p></section><section id="room-screen" class="screen" hidden></section></main><div class="modal" id="modal"><form class="dialog" id="form"><h2>Reserve a conversation</h2><label for="topic">What would you like to talk about?</label><input id="topic" required maxlength="45" placeholder="For example: How do you stay motivated?"><label for="minutes">Start in how many minutes?</label><input id="minutes" type="number" min="1" max="240" value="15" required><div class="actions"><button class="action" type="submit">Reserve circle</button><button class="action light" type="button" id="cancel">Cancel</button></div></form></div><script>
const saved=JSON.parse(localStorage.getItem('iramble-rooms')||'null');const rooms=saved||Array(9).fill(null);let pending=null,active=null,raised=false;
const $=s=>document.querySelector(s);function persist(){localStorage.setItem('iramble-rooms',JSON.stringify(rooms))}function esc(v){return v.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function wedge(i,fill,opacity){const a=(-90+i*30)*Math.PI/180,b=(-90+(i+1)*30)*Math.PI/180,x1=120+104*Math.cos(a),y1=120+104*Math.sin(a),x2=120+104*Math.cos(b),y2=120+104*Math.sin(b);return `<path d="M120 120 L${x1.toFixed(1)} ${y1.toFixed(1)} A104 104 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}Z" fill="${fill}" opacity="${opacity}" stroke="#f5f3ef" stroke-width="2"/>`}function remaining(room){return Math.max(0,room.starts-Date.now())}function svg(room,i){if(!room)return `<svg viewBox="0 0 240 240" aria-label="Empty conversation circle ${i+1}"><circle cx="120" cy="120" r="104" fill="#fffdf9" stroke="#c1cecc" stroke-width="2"/><text x="120" y="110" text-anchor="middle" font-size="34" fill="#60706e">+</text><text x="120" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#526260">Reserve a talk</text></svg>`;let sec=remaining(room)/1000,fade=.28+.72*Math.min(1,sec/1800),parts=[];for(let s=0;s<12;s++)parts.push(wedge(s,s===0?'#174d50':s<room.seats?'#247b77':'#fffdf9',fade));let m=Math.floor(sec/60),ss=Math.floor(sec%60),status=sec?`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:'LIVE';return `<svg viewBox="0 0 240 240" aria-label="${esc(room.topic)}, ${room.seats} seats filled">${parts.join('')}<circle cx="120" cy="120" r="61" fill="#f5f3ef"/><text x="120" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#203033">${esc(room.topic)}</text><text x="120" y="130" text-anchor="middle" font-size="12" font-weight="800" fill="#a44336">${status}</text><text x="120" y="151" text-anchor="middle" font-size="11" fill="#526260">${room.seats}/12 seats</text></svg>`}function render(){const box=$('#rooms');box.innerHTML=rooms.map((r,i)=>`<button class="room" data-i="${i}" aria-label="${r?'Open '+r.topic:'Reserve conversation circle'}">${svg(r,i)}</button>`).join('');box.querySelectorAll('.room').forEach(b=>b.onclick=e=>clickRoom(+b.dataset.i,e))}function clickRoom(i,event){const room=rooms[i];if(!room){pending=i;$('#modal').classList.add('open');return}const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width*240,y=(event.clientY-rect.top)/rect.height*240,dist=Math.hypot(x-120,y-120);if(dist<64){openRoom(i);return}if(room.seats<12){room.seats++;persist();render()}}function openRoom(i){active=i;$('#home').hidden=true;let r=rooms[i],sec=Math.floor(remaining(r)/1000),live=sec===0,min=Math.floor(sec/60),s=sec%60;$('#room-screen').hidden=false;$('#room-screen').innerHTML=`<button class="back">← Back to circles</button><article class="card"><span class="pill">${live?'Live now':'Lobby open'}</span><h2>${esc(r.topic)}</h2><p>${live?'The conversation is live. The host can bring listeners up from the hand queue.':'This public room starts in '+String(min).padStart(2,'0')+':'+String(s).padStart(2,'0')+'. You have a listener seat in the lobby.'}</p><div class="row"><div class="stat"><span>Host</span><strong>Room creator</strong></div><div class="stat"><span>Participants</span><strong>${r.seats} / 12</strong></div></div><div class="actions"><button class="action" id="hand">${raised?'Hand raised ✓':'Raise hand'}</button><button class="action light" id="leave">Leave room</button><button class="action light" id="report">Report</button></div><section class="queue"><h3>Speaker queue</h3><p>${raised?'You are next in line to speak.':'No one is waiting to speak. Raise your hand to join the queue.'}</p></section></article>`;$('.back').onclick=closeRoom;$('#hand').onclick=()=>{raised=!raised;openRoom(i)};$('#leave').onclick=closeRoom;$('#report').onclick=()=>alert('Report saved in this prototype. A real app would send it to moderators.')}function closeRoom(){$('#room-screen').hidden=true;$('#home').hidden=false;active=null;raised=false}$('#form').onsubmit=e=>{e.preventDefault();rooms[pending]={topic:$('#topic').value.trim(),starts:Date.now()+(+$('#minutes').value*60000),seats:1};persist();$('#modal').classList.remove('open');$('#form').reset();render()};$('#cancel').onclick=()=>{$('#modal').classList.remove('open');pending=null};setInterval(()=>{render();if(active!==null)openRoom(active)},1000);render();
</script>
<script>
  // Add local seat ownership to the GitHub Pages prototype. In a real app,
  // the server would track the exact participant and slice for every person.
  const originalOpenRoom = openRoom;
  clickRoom = function (i, event) {
    const room = rooms[i];
    if (!room) { pending = i; $('#modal').classList.add('open'); return; }
    const rect = event.currentTarget.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width * 240;
    const y = (event.clientY - rect.top) / rect.height * 240;
    if (Math.hypot(x - 120, y - 120) < 64) { openRoom(i); return; }
    if (room.seats < 12 && room.mySeat === undefined) {
      room.mySeat = room.seats;
      room.seats += 1;
      persist(); render();
    }
  };
  openRoom = function (i) {
    originalOpenRoom(i);
    $('#leave').onclick = () => {
      const room = rooms[i];
      if (room && room.mySeat > 0) {
        room.seats -= 1;
        delete room.mySeat;
      } else if (room && room.mySeat === 0) {
        rooms[i] = null;
      }
      persist(); closeRoom(); render();
    };
  };
  $('#form').onsubmit = event => {
    event.preventDefault();
    rooms[pending] = { topic: $('#topic').value.trim(), starts: Date.now() + (+$('#minutes').value * 60000), seats: 1, mySeat: 0 };
    persist(); $('#modal').classList.remove('open'); $('#form').reset(); render();
  };
</script></body></html>
